<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Переговорный тренажёр PRO</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182333;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:18px auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;background:#dbeafe;color:#1d4ed8;border-radius:20px;padding:7px 12px}h1{font-size:clamp(25px,5vw,36px);margin:12px 0 4px}p{line-height:1.55}.muted{color:#637185}.card{background:white;border-radius:22px;padding:24px;margin-top:20px;box-shadow:0 8px 25px #1c315012}.progress{height:8px;background:#e8eef8;border-radius:12px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#2563eb;transition:width .3s}.case{border-left:4px solid #2563eb;background:#f3f7ff;padding:15px;border-radius:8px;margin:18px 0;font-weight:600;line-height:1.55}.option{width:100%;background:#fff;border:1.5px solid #d8e1ee;border-radius:13px;text-align:left;padding:15px;margin:7px 0;font-size:16px;line-height:1.45;color:#17243a;cursor:pointer}.option:active{transform:scale(.995)}.option:hover{border-color:#2563eb;background:#f7faff}.option:disabled{cursor:default}.option.chosen{border-color:#2563eb;background:#eaf1ff}.primary{background:#2563eb;color:white;border:0;border-radius:13px;padding:15px 20px;font-size:16px;font-weight:650;width:100%;margin-top:14px;cursor:pointer}.feedback{background:#f5f8fc;padding:17px;border-radius:14px;margin-top:16px}.feedback strong{display:block;margin-bottom:6px}.score{font-size:40px;font-weight:800;color:#1d4ed8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:12px;background:#f2f6fc}.stat b{display:block;font-size:22px}.hidden{display:none}.small{font-size:13px}.sectiontitle{font-weight:700;margin-top:20px}@media(max-width:480px){body{padding:12px}.card{padding:19px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="top"><span class="tag">ПИЛОТ · PRO 2.0</span><span class="muted small">Без регистрации · бесплатно</span></div><h1>🎯 Тренажёр переговоров</h1><p class="muted">10 ситуаций для опытных риелторов. Выбирай не самый красивый ответ, а тот, который продвинет переговоры.</p><section class="card" id="app" aria-live="polite"></section></main><script>
const cases=[
{skill:'Диагностика мотива',scene:'Клиент: «Я пока просто смотрю квартиры. Покупать не тороплюсь». Вы знаете, что он уже обращался к трём агентам.',opts:[['Понял. Тогда пришлю вам подборку лучших предложений.',1,'Подборка без понимания задачи не помогает отличиться от других агентов.'],['Что произошло, что вы вообще начали изучать варианты? И что должно измениться, чтобы решение стало актуальным?',3,'Выясняете событие-триггер и критерии готовности к решению.'],['Если не торопитесь, лучше подождать снижения ставок.',0,'Преждевременный совет без данных о ситуации клиента.']],tip:'Ищите причину поиска и условие принятия решения, а не только срок покупки.'},
{skill:'Работа с ценой',scene:'Клиент: «Квартира хорошая, но цена явно завышена. В соседнем ЖК дешевле на миллион».',opts:[['Там другое качество, здесь застройщик надёжнее.',1,'Возможное объяснение, но вы спорите с оценкой клиента до выяснения сравнения.'],['Давайте посмотрим, какие параметры вы сравнили: площадь, отделку, срок сдачи, платеж и ликвидность.',3,'Переводите возражение из эмоции в проверяемые критерии.'],['Попробую выбить для вас скидку.',1,'Скидка до анализа ценности может обесценить объект.']],tip:'Сначала согласуйте критерии сравнения, потом обсуждайте цену.'},
{skill:'Выявление лиц решения',scene:'Клиент: «Мне всё нравится, но надо ещё с супругой обсудить». Супруга ни разу не участвовала в показах.',opts:[['Конечно. Напишите, когда решите.',1,'Вы отдаёте инициативу и не узнаёте, что важно второму участнику.'],['Давайте сразу поставим бронь, чтобы цена не ушла.',0,'Давление до согласования решения в семье создаёт сопротивление.'],['Что для супруги будет главным при выборе? Может, организуем короткую встречу втроём, чтобы услышать её вопросы?',3,'Учитываете реальный процесс принятия решения и предлагаете следующий шаг.']],tip:'Выясняйте всех участников решения как можно раньше.'},
{skill:'Управление сомнением',scene:'После двух просмотров клиент говорит: «Надо подумать». До этого он активно задавал вопросы по ипотеке.',opts:[['Конечно. О чём именно хочется подумать: о квартире, платеже или самом решении покупать?',3,'Уточняете источник неопределённости без давления.'],['Понимаю, это серьёзное решение. Позвоню через неделю.',1,'Уважительно, но вы теряете возможность помочь с конкретным сомнением.'],['Предложение действует только сегодня, лучше решаться.',0,'Искусственная срочность подрывает доверие.']],tip:'«Подумаю» — сигнал к диагностике, а не автоматический отказ.'},
{skill:'Финансовая диагностика',scene:'Клиент выбирает квартиру за 11 млн. Ежемесячный платёж получается выше комфортного бюджета на 25%.',opts:[['Платежи со временем станут легче, доходы вырастут.',0,'Нельзя строить рекомендацию на неподтверждённом росте дохода.'],['Давайте проверим безопасный платёж, резерв и альтернативы: иной взнос, срок или объект.',3,'Ставите финансовую устойчивость клиента выше сделки.'],['Попробуем ещё один банк, может, одобрят.',1,'Одобрение не означает комфортную долговую нагрузку.']],tip:'Конверсия без финансовой безопасности клиента — плохой результат.'},
{skill:'Работа с конкурентом',scene:'Клиент: «Другой агент обещает ту же квартиру и ещё подарок. Зачем мне работать с вами?»',opts:[['Пусть тогда другой агент и ведёт сделку.',0,'Реакция закрывает возможность показать ценность вашей работы.'],['Мы тоже можем что-нибудь подарить.',1,'Вы переводите разговор в соревнование бонусов.'],['Справедливый вопрос. Давайте сравним, что именно входит в сопровождение и какие риски каждый из нас берёт на себя.',3,'Обсуждаете ценность, прозрачность и ответственность, а не подарок.']],tip:'Дифференцируйтесь качеством решения, а не только бонусами.'},
{skill:'Переговоры о скидке',scene:'Покупатель: «Если снизите цену на 500 тысяч, я готов купить». При этом его критерии ещё не проверены.',opts:[['Если согласуем цену, что ещё должно совпасть, чтобы вы действительно вышли на сделку?',3,'Проверяете реальность намерения и другие условия до торга.'],['Сейчас узнаю у застройщика.',1,'Вы начинаете торг без понимания готовности клиента.'],['Таких скидок не бывает.',0,'Категоричный ответ без проверки закрывает переговоры.']],tip:'Скидка — часть пакета условий, а не единственный предмет переговоров.'},
{skill:'Конфликт критериев',scene:'Пара выбирает квартиру. Один хочет вид и дизайн, другой — минимальный платёж. Разговор начинает переходить в спор.',opts:[['Предложу компромиссный объект посередине по цене.',1,'Компромисс без приоритетов может не устроить никого.'],['Давайте по очереди назовём по три обязательных критерия и один, которым готовы пожертвовать.',3,'Помогаете сформировать общую систему решения.'],['Финансовая безопасность важнее вида, лучше взять дешевле.',1,'Вы подменяете решение семьи своим выбором.']],tip:'Сначала общие критерии, потом конкретные объекты.'},
{skill:'Следующий шаг',scene:'Клиент согласен, что вариант подходит. Но в конце встречи говорит: «Ну, тогда будем на связи».',opts:[['Отлично, буду ждать звонка.',1,'Не закрепляете ни действие, ни срок.'],['Давайте зафиксируем, что осталось проверить и когда вернёмся к решению. Удобнее завтра в 18:00 или в четверг?',3,'Создаёте конкретный, согласованный следующий шаг.'],['Я тогда прямо сейчас отправлю документы на бронь.',0,'Переходите к оформлению без согласия клиента.']],tip:'У каждой результативной встречи должен быть согласованный следующий шаг.'},
{skill:'Этика и доверие',scene:'Застройщик предлагает повышенную комиссию за объект, который хуже соответствует запросу клиента, чем другой доступный вариант.',opts:[['Покажу оба варианта, честно сравню по критериям клиента и объясню свою рекомендацию.',3,'Сохраняете независимость рекомендации и долгосрочное доверие.'],['Продам объект с большей комиссией: это моя работа.',0,'Конфликт интересов ухудшает качество решения для клиента.'],['Не буду показывать объект с повышенной комиссией вообще.',1,'Скрывать подходящий вариант тоже не обязательно; важна прозрачная оценка.']],tip:'Репутация и повторные рекомендации строятся на интересах клиента.'}
];
let i=0,points=0,chosen=[],skillScores={};const app=document.getElementById('app');function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(i>=cases.length)return results();const c=cases[i];app.innerHTML=`<div class="muted">Ситуация ${i+1} из ${cases.length} · ${escape(c.skill)}</div><div class="progress"><div class="bar" style="width:${i/cases.length*100}%"></div></div><div class="case">${escape(c.scene)}</div><p><b>Как ответите клиенту?</b></p><div id="options"></div><div id="feedback"></div>`;const el=document.getElementById('options');c.opts.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.textContent=o[0];b.onclick=()=>pick(j);el.appendChild(b)})}function pick(j){const c=cases[i],o=c.opts[j];points+=o[1];chosen.push({skill:c.skill,score:o[1]});skillScores[c.skill]=o[1];document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add('chosen')});const f=document.getElementById('feedback');f.className='feedback';f.innerHTML=`<strong>${o[1]===3?'Сильное решение · 3/3':o[1]===1?'Частично эффективно · 1/3':'Рискованное решение · 0/3'}</strong><p>${escape(o[2])}</p><p class="muted"><b>Принцип:</b> ${escape(c.tip)}</p>`;const next=document.createElement('button');next.className='primary';next.textContent=i===cases.length-1?'Посмотреть диагностику':'Следующая ситуация →';next.onclick=()=>{i++;render();window.scrollTo({top:0,behavior:'smooth'})};f.appendChild(next)}function results(){const max=cases.length*3,pct=Math.round(points/max*100),weak=chosen.filter(x=>x.score<3).sort((a,b)=>a.score-b.score);const grade=pct>=85?'Сильная переговорная база':pct>=60?'Хороший уровень с точками роста':'Есть навыки, которые стоит усилить';app.innerHTML=`<h2>Тренировка завершена</h2><div class="score">${points} / ${max}</div><p><b>${grade}</b> · ${pct}%</p><div class="grid"><div class="stat"><span class="muted">Сильных решений</span><b>${chosen.filter(x=>x.score===3).length}</b></div><div class="stat"><span class="muted">Зон развития</span><b>${weak.length}</b></div></div><p class="sectiontitle">Диагностика по навыкам</p><div id="skills"></div><p class="sectiontitle">Что потренировать дальше</p><div id="tips"></div><button class="primary" id="restart">Пройти заново ↻</button><p class="muted small">Это учебная симуляция с заранее заданными вариантами, а не ИИ-анализ свободной речи. Результат показывает выбор в 10 ситуациях, но не измеряет реальную конверсию.</p>`;document.getElementById('skills').innerHTML=chosen.map(x=>`<p style="margin:9px 0">${escape(x.skill)} — <b>${x.score}/3</b></p>`).join('');document.getElementById('tips').innerHTML=weak.length?weak.slice(0,3).map(x=>`<p>• ${escape(x.skill)}: вернитесь к этому типу ситуации и попробуйте сформулировать ответ своими словами.</p>`).join(''):'<p>Во всех ситуациях выбраны сильные варианты. Следующий уровень — практика свободного диалога с живым партнёром.</p>';document.getElementById('restart').onclick=()=>{i=0;points=0;chosen=[];skillScores={};render();window.scrollTo({top:0,behavior:'smooth'})}}render();
</script></body></html>
