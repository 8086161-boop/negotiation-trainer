<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр переговоров риелтора</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="header">
        <h1>Тренажёр переговоров риелтора</h1>
        <p>Практика переговоров, выявления потребностей и работы с клиентами</p>
    </header>

    <section id="start-screen" class="card">
        <h2>Выберите кейс клиента</h2>
        <div id="cases-list"></div>
    </section>

    <section id="trainer-screen" class="hidden">
        <div class="card">
            <h2 id="client-name"></h2>
            <p><b>Возраст:</b> <span id="client-age"></span></p>
            <p><b>Роль:</b> <span id="client-role"></span></p>
            <p><b>Ситуация:</b> <span id="client-situation"></span></p>
        </div>

        <div class="card">
            <div id="step-number"></div>
            <h3>Клиент:</h3>
            <div id="client-message"></div>

            <h3>Ваш ответ:</h3>
            <div id="answers-container"></div>
        </div>

        <div id="reaction-card" class="card hidden">
            <h3>Реакция клиента</h3>
            <p id="client-reaction"></p>

            <h3>Разбор</h3>
            <p id="step-analysis"></p>

            <button id="next-step">Следующий этап</button>
        </div>
    </section>

    <section id="result-screen" class="card hidden">
        <h2>Итог тренировки</h2>
        <h3>Профиль риелтора</h3>
        <p id="profile-text"></p>

        <h3>Навыки</h3>
        <div id="scores-container"></div>

        <button id="restart">Выбрать другой кейс</button>
    </section>
</div>

<script src="cases.js"></script>

<script>
let currentCase;
let currentStep = 0;

let scores = {
    trust:0,
    needs:0,
    communication:0,
    objection:0,
    closing:0
};

function loadCases(){
    const list = document.getElementById("cases-list");

    cases.forEach((item,index)=>{
        const button=document.createElement("button");
        button.className="case-button";
        button.innerHTML=item.client.name+"<br>"+item.client.role;
        button.onclick=()=>startCase(index);
        list.appendChild(button);
    });
}

function startCase(index){
    currentCase=cases[index];
    currentStep=0;

    scores={trust:0,needs:0,communication:0,objection:0,closing:0};

    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("trainer-screen").classList.remove("hidden");

    showStep();
}

function showStep(){
    const client=currentCase.client;
    const step=currentCase.steps[currentStep];

    document.getElementById("client-name").innerText=client.name;
    document.getElementById("client-age").innerText=client.age;
    document.getElementById("client-role").innerText=client.role;
    document.getElementById("client-situation").innerText=currentCase.situation;

    document.getElementById("step-number").innerText=
        "Этап "+(currentStep+1)+" из "+currentCase.steps.length;

    document.getElementById("client-message").innerText=step.client;

    const box=document.getElementById("answers-container");
    box.innerHTML="";

    step.answers.forEach(answer=>{
        const btn=document.createElement("button");
        btn.className="answer-button";
        btn.innerText=answer.text;
        btn.onclick=()=>chooseAnswer(answer);
        box.appendChild(btn);
    });
}

function chooseAnswer(answer){
    for(let key in answer.scores){
        scores[key]+=answer.scores[key];
    }

    document.getElementById("client-reaction").innerText=answer.reaction;
    document.getElementById("step-analysis").innerText=answer.analysis;

    document.getElementById("reaction-card").classList.remove("hidden");
}

document.getElementById("next-step").onclick=function(){
    currentStep++;

    document.getElementById("reaction-card").classList.add("hidden");

    if(currentStep < currentCase.steps.length){
        showStep();
    } else {
        showResult();
    }
};

function showResult(){
    document.getElementById("trainer-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");

    document.getElementById("profile-text").innerText=currentCase.result;

    const box=document.getElementById("scores-container");
    box.innerHTML="";

    for(let key in scores){
        box.innerHTML += "<p>"+key+": "+scores[key]+"</p>";
    }
}

document.getElementById("restart").onclick=function(){
    document.getElementById("result-screen").classList.add("hidden");
    document.getElementById("start-screen").classList.remove("hidden");
};

loadCases();
</script>

</body>
</html>
