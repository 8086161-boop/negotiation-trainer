<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр переговоров для риелторов новостроек</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#475569);color:#fff}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;color:#111;border-radius:22px;padding:22px;margin:20px 0}
.avatar{font-size:50px}
button{width:100%;padding:15px;border:0;border-radius:14px;margin:8px 0;background:#2563eb;color:#fff;font-size:16px}
.answer{background:#eef2ff;color:#111;text-align:left}
.result{background:#e0f2fe;padding:15px;border-radius:15px}
</style>
</head>
<body>
<div class="container">
<h1>🎯 Тренажёр переговоров для риелторов новостроек</h1>
<div id="app"></div>
</div>

<script>
const cases=[
{
name:"Алексей, 37 лет",
avatar:"👨🏻",
skill:"Первый контакт",
steps:[
{
client:"Здравствуйте. А что за ЖК?",
answers:[
{
text:"Это новый жилой комплекс от застройщика. Есть разные планировки и цены.",
score:6,
analysis:"Вы дали информацию, но сразу перешли к презентации. Клиент пока не раскрыл свою задачу."
},
{
text:"Здравствуйте! Расскажу. Подскажите, вы просто интересуетесь проектом или уже выбираете квартиру?",
score:10,
analysis:"Вы начали с понимания клиента. Это помогает построить диалог до подбора вариантов."
},
{
text:"Могу отправить презентацию комплекса и цены.",
score:7,
analysis:"Вы помогаете клиенту, но есть риск остаться просто отправителем материалов."
}
]
}
]
},
{
name:"Марина, 34 года",
avatar:"👩🏼",
skill:"Выявление потребностей",
steps:[
{
client:"Какая цена на квартиры?",
answers:[
{text:"От 6 миллионов.",score:5,analysis:"Ответили на вопрос, но не узнали задачу клиента."},
{text:"Цена зависит от задачи. Подскажите, вы выбираете для себя или рассматриваете инвестицию?",score:10,analysis:"Вы используете вопрос для понимания потребности."},
{text:"Отправлю вам прайс застройщика.",score:6,analysis:"Полезно, но контакт может остаться поверхностным."}
]
}
]
}
];

let current=0,step=0,total=0;

function home(){
app.innerHTML=cases.map((c,i)=>`
<div class="card">
<div class="avatar">${c.avatar}</div>
<h2>${c.name}</h2>
<p>Навык: ${c.skill}</p>
<button onclick="start(${i})">Начать кейс</button>
</div>`).join("");
}

function start(i){
current=i;step=0;
showStep();
}

function showStep(){
let c=cases[current];
let s=c.steps[step];
app.innerHTML=`
<div class="card">
<div class="avatar">${c.avatar}</div>
<h2>${c.name}</h2>
<p><b>Клиент:</b><br>${s.client}</p>
<h3>Ваш ответ:</h3>
${s.answers.map((a,i)=>`<button class="answer" onclick="choose(${i})">${a.text}</button>`).join("")}
</div>`;
}

function choose(i){
let a=cases[current].steps[step].answers[i];
total+=a.score;
app.innerHTML=`
<div class="card">
<h2>Разбор ответа</h2>
<div class="result">${a.analysis}</div>
<p>Баллы: +${a.score}</p>
<button onclick="home()">К выбору кейсов</button>
</div>`;
}

home();
</script>
</body>
</html>
