<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр переговоров новостройки</title>
<style>
body{margin:0;font-family:Arial;background:#111827;color:#fff}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:#fff;color:#111;border-radius:24px;padding:24px;margin:20px 0}
.avatar{font-size:60px}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:16px;background:#2563eb;color:white;font-size:16px}
.answer{background:#eef2ff;color:#111;text-align:left}
.result{background:#dbeafe;padding:16px;border-radius:16px}
</style>
</head>
<body>
<div class="container">
<h1>🎯 Тренажёр переговоров<br>риелторов новостроек</h1>
<div id="app"></div>
</div>
<script>
const cases=[
{
name:"Андрей, 38 лет", avatar:"👨🏻",
steps:[
["Я просто смотрю рынок.",
["Подскажите, что для вас сейчас самое важное при выборе новостройки?",10],
["Отправлю несколько вариантов, чтобы вы посмотрели.",6],
["Расскажу про самые интересные ЖК.",7]],
["Рассматриваем для семьи, но пока не понимаем район.",
["Что должно измениться в вашей жизни после покупки квартиры?",10],
["Тогда покажу самые популярные варианты.",6],
["Нужно сначала выбрать район.",7]],
["Главное — не переплатить.",
["А с чем вы сравниваете стоимость и что будет для вас хорошей покупкой?",10],
["Тогда будем искать самый дешёвый вариант.",5],
["Сейчас расскажу про акции застройщиков.",7]],
["У нас с женой разные мнения.",
["Давайте разберём, что важно каждому из вас.",10],
["Пусть жена сама определится.",5],
["Я покажу вам разные квартиры.",7]],
["Почему мне нужен риелтор? Всё есть в интернете.",
["Информации действительно много. Моя задача — помочь отфильтровать варианты под вашу задачу.",10],
["Я знаю рынок лучше сайтов.",7],
["Можно и самостоятельно искать.",5]],
["Хорошо, а что дальше?",
["Сначала зафиксируем ваши критерии, потом подберём подходящие решения.",10],
["Давайте сразу смотреть квартиры.",7],
["Отправлю каталог объектов.",6]],
["Давайте посмотрим варианты.",
["Отлично, теперь мы понимаем вашу задачу и можем переходить к подбору.",10],
["Отправлю всё, что есть на рынке.",6],
["Покажу самые дорогие проекты.",5]]
]
}
];

let currentStep=0,total=0;

function show(){
let s=cases[0].steps[currentStep];
app.innerHTML=`<div class="card">
<div class="avatar">${cases[0].avatar}</div>
<h2>${cases[0].name}</h2>
<h3>Клиент говорит:</h3>
<p>${s[0]}</p>
<h3>Ваш ответ:</h3>
${[1,2,3].map(i=>`<button class="answer" onclick="choose(${i})">${s[i][0]}</button>`).join("")}
</div>`;
}
function choose(i){
let s=cases[0].steps[currentStep];
total+=s[i][1];
app.innerHTML=`<div class="card">
<h2>Разбор ответа</h2>
<div class="result">
<p>${s[i][0]}</p>
<p>Оценка навыка: +${s[i][1]} баллов</p>
</div>
<button onclick="next()">Продолжить</button>
</div>`;
}
function next(){
currentStep++;
if(currentStep<cases[0].steps.length)show();
else app.innerHTML=`<div class="card"><h2>🎯 Кейс завершён</h2><p>Итоговый результат: ${total}</p><p>Профиль: умение выстраивать коммуникацию и выявлять потребности.</p></div>`;
}
show();
</script>
</body>
</html>
