let ci=0,si=0,total=0;
function home(){
app.innerHTML=cases.map((c,i)=>`<div class="card"><div class="avatar">${c.avatar}</div><h2>${c.client}</h2><p>${c.situation}</p><button onclick="start(${i})">Начать кейс</button></div>`).join("");
}
function start(i){ci=i;si=0;total=0;show();}
function show(){
let s=cases[ci].steps[si];
app.innerHTML=`<div class="card"><div class="avatar">👤</div><h2>${cases[ci].client}</h2><p>Шаг ${si+1} из 7</p><h3>Клиент:</h3><p>${s.message}</p><h3>Ваш ответ:</h3>${s.answers.map((a,i)=>`<button class="answer" onclick="choose(${i})">${a.text}</button>`).join("")}</div>`;
}
function choose(i){
let a=cases[ci].steps[si].answers[i]; total+=a.score;
if(si<6){app.innerHTML=`<div class="card"><h2>Разбор шага</h2><div class="result">${a.analysis}<br><br>Реакция клиента: ${a.reaction}<br>Баллы +${a.score}</div><button onclick="next()">Следующий шаг</button></div>`}
else{app.innerHTML=`<div class="card"><h2>Кейс завершён</h2><div class="result">Результат: ${total}<br><br>Оценка навыков: контакт, потребности, экспертность.</div><button onclick="home()">К кейсам</button></div>`}
}
