<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр переговоров для риелторов новостроек v2.0</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#475569);color:#fff}
.container{max-width:900px;margin:auto;padding:24px}
.card{background:#fff;color:#111;border-radius:24px;padding:24px;margin:20px 0;box-shadow:0 10px 30px #0005}
.avatar{font-size:50px;background:#dbeafe;border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center}
button{width:100%;padding:15px;border:0;border-radius:14px;margin-top:10px;background:#2563eb;color:#fff;font-size:16px}
.answer{background:#eef2ff;color:#111;text-align:left}
.tag{background:#e0e7ff;padding:6px 12px;border-radius:20px;display:inline-block}
</style>
</head>
<body>
<div class="container">
<h1>🎯 Тренажёр переговоров для риелторов новостроек</h1>
<p>Тренировка навыков до этапа подбора квартиры: контакт, потребности, доверие, коммуникация.</p>
<div id="app"></div>
</div>
<script>
const cases=[
{n:"Алексей, 37 лет",a:"👨🏻",s:"Клиент из интернета",t:"А что за ЖК?",q:"Вы разместили информацию о жилом комплексе. Клиент пишет: «А что это за ЖК?»",ans:["Это новый ЖК от застройщика, расскажу характеристики.","Здравствуйте! Расскажу. Подскажите, вы просто изучаете варианты или уже выбираете квартиру?","Могу отправить презентацию и цены."],skill:"Первый контакт"},
{n:"Марина, 34 года",a:"👩🏼",s:"Покупатель",t:"Какая цена?",q:"Клиент пишет: «Сколько стоит квартира?»",ans:["От 6 миллионов.","Цена зависит от задачи и параметров. Подскажите, для себя рассматриваете или инвестиция?","Отправлю прайс застройщика."],skill:"Выявление потребности"},
{n:"Сергей,45 лет",a:"👨🏼",s:"Опытный клиент",t:"Я сам всё найду",q:"Клиент говорит: «Сейчас всё есть в интернете».",ans:["Вы правы, информации много. Давайте поймём, что важно именно вам.","Риелтор лучше знает рынок.","Тогда ищите самостоятельно."],skill:"Ценность специалиста"}
];

let total=0;
function home(){
app.innerHTML=cases.map((c,i)=>`<div class="card"><div class="avatar">${c.a}</div><h2>${c.n}</h2><p>${c.s}</p><span class="tag">${c.skill}</span><h3>${c.t}</h3><button onclick="start(${i})">Начать кейс</button></div>`).join("");
}
function start(i){
let c=cases[i];
app.innerHTML=`<div class="card"><div class="avatar">${c.a}</div><h2>${c.n}</h2><p>${c.q}</p><h3>Ваш ответ:</h3>${c.ans.map((x,j)=>`<button class="answer" onclick="finish(${j})">${x}</button>`).join("")}</div>`;
}
function finish(j){
total+=j==1?10:6;
app.innerHTML=`<div class="card"><h2>Разбор</h2><p>Сильная стратегия — сначала понять задачу клиента, затем переходить к решению.</p><p>Ваш результат: ${total}</p><button onclick="home()">Выбрать следующий кейс</button></div>`;
}
home();
</script>
</body>
</html>
